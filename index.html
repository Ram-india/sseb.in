<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defaults; per-route values are applied by src/components/Seo.jsx -->
    <meta
      name="description"
      content="Sree Saravana Engineering Bhavani Pvt.Ltd (SSEB) is an ISO 9001:2008 Certified Company was established in the year 1981 under the companies Act -1956"
    />
    <meta
      name="keywords"
      content="sseb,Sree-saravana,Bhavani,Engineering,Sree-Saravana-Engineering,Venkatachalam,Hydro-Power-Projects,Solar-Projects,Civil-works,sseb-India,sseb-Tamilnadu,Construction,Best-Construction-company,"
    />
    <!-- Site-wide meta, carried over from header/meta.php -->
    <meta name="Language" content="English" />
    <meta name="Distribution" content="Global" />
    <meta name="author" content="Ram Kumar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans for headings (modern geometric-humanist with real
         personality at display sizes), Inter for body and UI. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve every preference before first paint: no flash of the wrong
         theme, contrast or text size. Mirrors src/lib/preferences.js — keep
         the two in step. -->
    <script>
      (function () {
        try {
          var stored = {}
          try { stored = JSON.parse(localStorage.getItem('sseb-prefs') || '{}') } catch (e) {}

          // migrate the original theme-only key
          var legacy = localStorage.getItem('sseb-theme')
          if (!stored.theme && (legacy === 'dark' || legacy === 'light')) stored.theme = legacy

          var root = document.documentElement
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored.theme || 'system'
          if (theme === 'dark' || (theme === 'system' && prefersDark)) root.classList.add('dark')

          if (stored.motion === 'reduce') root.dataset.motion = 'reduce'
          if (stored.textSize === 'large' || stored.textSize === 'larger')
            root.dataset.textSize = stored.textSize
          if (stored.contrast === 'high') root.dataset.contrast = 'high'
          if (stored.underlineLinks) root.dataset.underline = 'on'
        } catch (e) {}
      })()
    </script>
    <title>SSEB — Sree Saravana Engineering Bhavani Private Limited</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
